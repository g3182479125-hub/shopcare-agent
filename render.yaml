services:
  - type: web
    name: shopcare-agent-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: ShopCare Agent
      - key: SHOPCARE_DB_PATH
        value: ./data/shopcare.db
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_MODEL
        value: deepseek-chat
      - key: LLM_TEMPERATURE
        value: "0.2"
      - key: LLM_API_KEY
        sync: false
      - key: ALLOW_ORIGINS
        sync: false
